<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proof of Life</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="mark" id="mark" title="Proof of Life"></div>
      <nav class="rail-nav" id="rail"></nav>
      <div class="rail-me" id="railme" title="You"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="tb-title"><span class="eyebrow" id="tb-eyebrow"></span><h1 id="tb-title"></h1></div>
        <div class="tb-right" id="tb-right"></div>
      </header>
      <section class="stage" id="stage"></section>
    </main>
  </div>

  <div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>

</html>
